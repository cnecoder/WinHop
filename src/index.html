<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>WinHop</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div id="app">
      <!-- 覆盖层（程序层/窗口层） -->
      <div id="overlay-view">
        <div id="header">
          <span class="header-left">
            <span id="title">WinHop</span>
            <span id="mode-badge"></span>
          </span>
          <span class="header-right">
            <span id="legend"></span>
            <span class="header-sep"></span>
            <button id="help-btn" data-i18n-title="help" aria-label="帮助">?</button>
            <button id="settings-btn" data-i18n-title="settings" data-i18n="settings">设置</button>
            <span id="hint" data-i18n="escExit">Esc 退出</span>
          </span>
        </div>
        <div id="list"></div>
      </div>

      <!-- 设置页（独立全屏页面） -->
      <div id="settings-view" hidden>
        <div id="settings-header">
          <button id="settings-back" data-i18n-title="setBack" data-i18n="setBack">← 返回</button>
          <span id="settings-title"><span data-i18n="setTitle">设置</span> <span id="settings-status" class="settings-status"></span></span>
          <button id="settings-save" class="primary-btn" data-i18n="setSave" disabled>保存</button>
        </div>
        <div id="settings-body">
          <div class="setting-section">
            <div class="setting-group-title" data-i18n="setHotkey">全局热键</div>
            <div class="hotkey-row">
              <span id="hotkey-display" class="hotkey-display">…</span>
              <button id="hotkey-btn" class="setting-row-btn" data-i18n="hotkeyRecord">录制</button>
            </div>
            <div class="hotkey-hint" data-i18n="hotkeyHint">点「录制」后按下组合键（须含 Ctrl/Alt/Shift/Win），实时显示在框内；Enter 结束录制，Esc 取消。修改后点右上「保存」生效。</div>
          </div>

          <div class="setting-section">
            <div class="setting-group-title" data-i18n="setLaunch">启动</div>
            <label class="setting-row">
              <input type="radio" name="autostart" id="autostart-check" />
              <span data-i18n="setAutostart">开机自启</span>
            </label>
          </div>

          <div class="setting-section">
            <div class="setting-group-title" data-i18n="setOrder">窗口排序方式</div>
            <label class="setting-row">
              <input type="radio" name="order" value="zorder" />
              <span data-i18n="orderZ">固定序号（按创建顺序，不受使用影响）</span>
            </label>
            <label class="setting-row">
              <input type="radio" name="order" value="mru" />
              <span data-i18n="orderMru">最近使用优先（上次用的排 1）</span>
            </label>
          </div>

          <div class="setting-section">
            <div class="setting-group-title" data-i18n="setMode">模式</div>
            <label class="setting-row">
              <input type="radio" name="mode" value="single" checked />
              <span data-i18n="modeSingle">单字母模式：每个程序一个字母键，一按直达</span>
            </label>
            <label class="setting-row">
              <input type="radio" name="mode" value="multi" />
              <span data-i18n="modeMulti">多字母模式：连续输入字母按代号/名称筛选，回车确认，代号可多字母（突破 26 个上限）</span>
            </label>
            <div id="multi-opts" style="display:none">
              <div class="setting-group-title" style="margin-top:12px" data-i18n="setWinDigit">窗口层数字键</div>
              <label class="setting-row">
                <input type="radio" name="win-digit-mode" value="jump" checked />
                <span data-i18n-html="digitJump">按数字直接跳转（窗口 ≤9 直切，&gt;9 快速连按组合编号）</span>
              </label>
              <label class="setting-row">
                <input type="radio" name="win-digit-mode" value="preview" />
                <span data-i18n-html="digitPreview">按数字先聚焦预览，回车确认（窗口 &gt;9 时 Backspace 退格）</span>
              </label>
            </div>
          </div>

          <div class="setting-section">
            <div class="setting-group-title" data-i18n="setLanguage">语言 / Language</div>
            <div id="lang-options"></div>
          </div>

          <div class="setting-section">
            <div class="setting-group-title" data-i18n="setTheme">主题</div>
            <div id="theme-options"></div>
          </div>

          <div class="setting-section">
            <div class="setting-group-title" data-i18n="setBlocked">黑名单（已屏蔽的程序）</div>
            <div id="blocked-list" class="blocked-list"></div>
          </div>

          <div class="setting-section">
            <button id="quit-btn" class="setting-row-btn" data-i18n="quit">退出 WinHop</button>
          </div>

          <div class="setting-section">
            <div class="setting-group-title" data-i18n="about">关于</div>
            <div id="version-info" class="version-info">版本 …</div>
            <button id="github-btn" class="setting-row-btn" style="margin-top:10px" data-i18n="githubRepo">GitHub 仓库</button>
            <div class="setting-group-title" style="margin-top:14px" data-i18n="changelog">更新记录</div>
            <div id="changelog" class="changelog"></div>
          </div>
        </div>
      </div>

      <!-- 帮助页（覆盖层内 F1 / 头部 ? 打开，纯前端视图，不经过 Rust 状态机） -->
      <div id="help-view" hidden>
        <div id="help-header">
          <button id="help-back" data-i18n="helpBack">← 返回</button>
          <span id="help-title" data-i18n="help">帮助</span>
        </div>
        <div id="help-body">
          <div class="help-section">
            <div class="setting-group-title" data-i18n="helpOpen">呼出与关闭</div>
            <div class="help-step"><span id="help-hotkey" class="key"></span><span data-i18n="helpOpenText"></span></div>
          </div>

          <div class="help-section">
            <div class="setting-group-title" data-i18n="helpPrograms">第一步：选程序</div>
            <div class="help-step"><span class="key">A</span><span data-i18n="helpSingle"></span></div>
            <div class="help-step"><span class="key">ch</span><span data-i18n="helpMulti"></span></div>
          </div>

          <div class="help-section">
            <div class="setting-group-title" data-i18n="helpWindows">第二步：选窗口</div>
            <div class="help-step"><span class="key">1</span><span data-i18n-html="helpWinDigit"></span></div>
          </div>

          <div class="help-section">
            <div class="setting-group-title" data-i18n="helpKeys">其它按键</div>
            <div class="help-step"><span class="key">Space</span><span data-i18n="helpSpace"></span></div>
            <div class="help-step"><span class="key">↑↓</span><span data-i18n="helpArrows"></span></div>
            <div class="help-step"><span class="key">PgUp</span><span class="key">PgDn</span><span data-i18n="helpPager"></span></div>
            <div class="help-step"><span class="key">F2</span><span data-i18n="helpF2"></span></div>
            <div class="help-step"><span class="key">F11</span><span data-i18n="helpF11"></span></div>
          </div>

          <div class="help-section">
            <div class="setting-group-title" data-i18n="helpEdit">绑定代号 / 改名 / 屏蔽</div>
            <div class="help-step"><span class="key">✎</span><span data-i18n="helpEditText"></span></div>
          </div>

          <div class="help-section">
            <div class="setting-group-title" data-i18n="helpMore">更多</div>
            <div class="help-step"><span class="key">Esc</span><span data-i18n="helpMoreText"></span></div>
          </div>
        </div>
      </div>

      <!-- 未保存确认弹窗 -->
      <div id="confirm-mask" hidden>
        <div id="confirm-dialog">
          <div class="confirm-text" data-i18n="confirmText">有未保存的修改，是否保存？</div>
          <div class="confirm-buttons">
            <button id="confirm-save" class="primary-btn" data-i18n="confirmSave">保存</button>
            <button id="confirm-discard" data-i18n="confirmDiscard">不保存</button>
            <button id="confirm-cancel" data-i18n="confirmCancel">取消</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
