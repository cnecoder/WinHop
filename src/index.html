<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>WinTab</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div id="app">
      <!-- 覆盖层（程序层/窗口层） -->
      <div id="overlay-view">
        <div id="header">
          <span class="header-left">
            <span id="title">WinTab</span>
            <span id="mode-badge"></span>
          </span>
          <span class="header-right">
            <span id="legend"></span>
            <span class="header-sep"></span>
            <button id="settings-btn" title="设置 (F2)">设置</button>
            <span id="hint">Esc 退出</span>
          </span>
        </div>
        <div id="list"></div>
      </div>

      <!-- 设置页（独立全屏页面） -->
      <div id="settings-view" hidden>
        <div id="settings-header">
          <button id="settings-back" title="返回 (Esc)">← 返回</button>
          <span id="settings-title">设置 <span id="settings-status" class="settings-status"></span></span>
          <button id="settings-save" class="primary-btn" disabled>保存</button>
        </div>
        <div id="settings-body">
          <div class="setting-section">
            <div class="setting-group-title">窗口排序方式</div>
            <label class="setting-row">
              <input type="radio" name="order" value="zorder" />
              <span>固定序号（按创建顺序，不受使用影响）</span>
            </label>
            <label class="setting-row">
              <input type="radio" name="order" value="mru" />
              <span>最近使用优先（上次用的排 1）</span>
            </label>
          </div>

          <div class="setting-section">
            <div class="setting-group-title">多字母模式</div>
            <label class="setting-row">
              <input type="checkbox" id="multi-letter" />
              <span>连续输入字母按代号/名称筛选，回车确认（关闭时单字母直切）</span>
            </label>
          </div>

          <div class="setting-section">
            <button id="quit-btn" class="setting-row-btn">退出 WinTab</button>
          </div>

          <div class="setting-section">
            <div class="setting-group-title">关于</div>
            <div id="version-info" class="version-info">版本 …</div>
            <div class="setting-group-title" style="margin-top:14px">更新记录</div>
            <div id="changelog" class="changelog"></div>
          </div>
        </div>
      </div>

      <!-- 未保存确认弹窗 -->
      <div id="confirm-mask" hidden>
        <div id="confirm-dialog">
          <div class="confirm-text">有未保存的修改，是否保存？</div>
          <div class="confirm-buttons">
            <button id="confirm-save" class="primary-btn">保存</button>
            <button id="confirm-discard">不保存</button>
            <button id="confirm-cancel">取消</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
