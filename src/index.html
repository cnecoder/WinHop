<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>WinTab</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div id="app">
      <div id="header">
        <span id="title">WinTab</span>
        <span class="header-right">
          <button id="settings-btn" title="设置 (F2)">设置</button>
          <span id="hint">Esc 退出</span>
        </span>
      </div>
      <div id="settings" hidden>
        <div class="setting-title">窗口排序方式</div>
        <label class="setting-row">
          <input type="radio" name="order" value="zorder" />
          <span>固定序号（按创建顺序，不受使用影响）</span>
        </label>
        <label class="setting-row">
          <input type="radio" name="order" value="mru" />
          <span>最近使用优先（上次用的排 1）</span>
        </label>
        <div class="setting-title">多字母模式</div>
        <label class="setting-row">
          <input type="checkbox" id="multi-letter" />
          <span>连续输入字母按名称筛选，回车确认（关闭时单字母直切）</span>
        </label>
        <div class="setting-title">其他</div>
        <button id="quit-btn" class="setting-row-btn">退出 WinTab</button>
      </div>
      <div id="list"></div>
    </div>
  </body>
</html>
