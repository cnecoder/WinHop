name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: 测试（Rust 单测 + 前端语法）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 前端 JS 语法检查
        run: node --check src/main.js && node --check src/i18n.js

  release:
    name: 打包并发布 Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: 安装前端依赖
        run: npm ci
      - name: 构建安装包（NSIS + MSI）
        run: npm run tauri build
      - name: 创建 GitHub Release 并上传安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = $env:GITHUB_REF_NAME
          gh release create $ver `
            "src-tauri/target/release/bundle/nsis/WinHop_${ver#v}_x64-setup.exe" `
            "src-tauri/target/release/bundle/msi/WinHop_${ver#v}_x64_en-US.msi" `
            --title "WinHop $ver" --generate-notes
