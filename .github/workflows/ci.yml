name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: 测试（Rust 单测 + 前端语法）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust 单元测试
        # --nocapture：让 SKIP 标注（如 Chrome 未装跳过的回归断言）在 Actions 日志里可见
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 前端 JS 语法检查 + 纯函数单测
        run: node --check src/main.js && node --check src/i18n.js && node --test

  release:
    name: 打包并发布 Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: 安装前端依赖
        run: npm ci
      - name: 构建安装包（NSIS + MSI）
        run: npm run tauri build
      - name: 创建或更新 GitHub Release 并上传安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 注意：Windows runner 默认 shell 是 PowerShell，不用 Bash 的 ${ver#v} 去前缀语法
          $ver = $env:GITHUB_REF_NAME
          $noV = $ver -replace '^v',''
          $nsis = "src-tauri/target/release/bundle/nsis/WinHop_${noV}_x64-setup.exe"
          $msi = "src-tauri/target/release/bundle/msi/WinHop_${noV}_x64_en-US.msi"
          # 幂等：release 已存在（如手动先发了双语 note）则只覆盖资产、不动正文；否则新建
          if (gh release view $ver 2>$null) {
            gh release upload $ver $nsis $msi --clobber
          } else {
            gh release create $ver $nsis $msi --title "WinHop $ver" --generate-notes
          }
